server {
    listen       8080;
    server_name  localhost;
    set $naxsi_json_log 1;

    location / {
        SecRulesEnabled;                        # activa NAXSI (sin libinjection)
        DeniedUrl "/NaxsiRequestDenied";
        CheckRule "$SQL >= 8" BLOCK;            # bloquea cuando el score SQL llega a 8
        CheckRule "$RFI >= 8" BLOCK;
        CheckRule "$TRAVERSAL >= 5" BLOCK;
        CheckRule "$XSS >= 8" BLOCK;
        CheckRule "$EVADE >= 8" BLOCK;

        proxy_pass http://dvwa:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /NaxsiRequestDenied {
        internal;
        return 403;
    }
}

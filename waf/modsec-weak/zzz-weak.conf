SecRuleRemoveByTag "attack-sqli"

SecRule ARGS "@rx (?i)union\s+select"              "id:1000100,phase:2,deny,status:403,log,msg:'weak-sqli: union select'"
SecRule ARGS "@rx (?i)\bor\s+[0-9]+\s*=\s*[0-9]+"  "id:1000101,phase:2,deny,status:403,log,msg:'weak-sqli: or N=N'"
SecRule ARGS "@rx (?i)\band\s+[0-9]+\s*=\s*[0-9]+" "id:1000102,phase:2,deny,status:403,log,msg:'weak-sqli: and N=N'"

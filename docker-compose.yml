# DVWA lab, served several ways so the study can compare WAF tiers against the SAME target:
#   - baseline    : DVWA direct                        -> DVWA_URL=http://localhost
#   - naive       : DVWA behind our regex WAF           -> DVWA_URL=http://localhost:8082  (bypassable)
#   - modsec-weak : DVWA behind ModSecurity (sin CRS)   -> DVWA_URL=http://localhost:8083  (bypassable)
#   - crs         : DVWA behind ModSecurity + OWASP CRS -> DVWA_URL=http://localhost:8081  (hard)
#
# Bring up:   docker-compose up -d --build   (or: docker compose up -d --build)
# First time: open http://localhost (admin/password) -> "Create / Reset Database"
version: "3.8"

services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: sqli-dvwa
    ports:
      - "80:80"            # baseline, no WAF
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:apache
    container_name: sqli-waf
    depends_on:
      - dvwa
    environment:
      BACKEND: "http://dvwa:80"      # proxy upstream = the DVWA container (resolved by service name)
      PORT: "8080"                   # port ModSecurity listens on inside the container
      SERVER_NAME: "localhost"
      MODSEC_RULE_ENGINE: "On"       # On = block; DetectionOnly = log but allow
      PARANOIA: "1"                  # CRS paranoia level 1..4 (raise to make evasion harder)
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    ports:
      - "8081:8080"        # DVWA behind the CRS WAF
    restart: unless-stopped

  naive-waf:
    build: ./waf
    container_name: sqli-naive-waf
    depends_on:
      - dvwa
    environment:
      BACKEND: "http://dvwa:80"
      PORT: "8082"
    ports:
      - "8082:8082"        # DVWA behind our naive regex WAF (bypassable tier)
    restart: unless-stopped

  modsec-weak:
    build: ./waf/modsec-weak
    container_name: sqli-modsec-weak
    depends_on:
      - dvwa
    environment:
      BACKEND: "http://dvwa:80"
      PORT: "8080"
      SERVER_NAME: "localhost"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      ANOMALY_INBOUND: "1000"   # el CRS no bloquea por score; solo las reglas basicas propias
      ANOMALY_OUTBOUND: "1000"
    ports:
      - "8083:8080"        # DVWA behind a weak ModSecurity (no CRS enforcement) — bypassable
    restart: unless-stopped

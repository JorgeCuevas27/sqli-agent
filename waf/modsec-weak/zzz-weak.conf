# ModSecurity "debil" (mal configurado) — tier intermedio bypasseable.
#
# Se carga DESPUES del CRS (nombre zzz-*, alfabeticamente ultimo). Hace dos cosas:
#  1. Quita la deteccion SQLi del CRS (libinjection + reglas con removeComments).
#  2. Agrega reglas de firma basicas que bloquean SQLi PLANO (y case, por (?i)) pero
#     NO normalizan comentarios -> evadibles con /**/.
#
# Representa un ModSecurity desplegado sin la fuerza del CRS/libinjection, que es como esta
# configurado gran parte del mundo real (y explica por que algunos papers reportan 89% de bypass
# contra "ModSecurity" y otros 5%: depende de la configuracion).
SecRuleRemoveByTag "attack-sqli"

SecRule ARGS "@rx (?i)union\s+select"              "id:1000100,phase:2,deny,status:403,log,msg:'weak-sqli: union select'"
SecRule ARGS "@rx (?i)\bor\s+[0-9]+\s*=\s*[0-9]+"  "id:1000101,phase:2,deny,status:403,log,msg:'weak-sqli: or N=N'"
SecRule ARGS "@rx (?i)\band\s+[0-9]+\s*=\s*[0-9]+" "id:1000102,phase:2,deny,status:403,log,msg:'weak-sqli: and N=N'"

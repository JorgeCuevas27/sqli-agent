services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: sqli-dvwa
    ports:
      - "80:80"
    restart: unless-stopped

  naxsi:
    build: ./waf/naxsi
    container_name: sqli-naxsi
    depends_on:
      - dvwa
    ports:
      - "8084:8080"
    restart: unless-stopped

  modsec-weak:
    build: ./waf/modsec-weak
    container_name: sqli-modsec-weak
    depends_on:
      - dvwa
    environment:
      BACKEND: "http://dvwa:80"
      PORT: "8080"
      SERVER_NAME: "localhost"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      ANOMALY_INBOUND: "1000"
      ANOMALY_OUTBOUND: "1000"
    ports:
      - "8083:8080"
    restart: unless-stopped
